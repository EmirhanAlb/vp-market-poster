name: Market Poster -> Slack

# NEDEN CRON DEGIL DE UZUN CALISAN IS?
#
# Saatlik cron ayarliydi ama GitHub'in zamanlayicisi bu repoda onu
# calistirmiyor: 27-31 Agustos 2026 arasinda gunde 24 yerine 1-6 calistirma
# gerceklesti, aralarda 10 saati asan bosluklar oldu. Son Dakika ve
# FinancialJuice akislarindaki cozumun ayni: tek uzun is icinde gonderim
# saatlerini kendimiz beklemek, is bitiminde workflow'un kendini yeniden
# tetiklemesi.
#
# GONDERIM SAATLERI (TR): 11:00, 14:00, 16:00, 16:50, 17:00, 18:00 - baska
# hicbir saatte gonderilmez. Degistirmek icin koda dokunmaya gerek yok:
# Settings > Secrets and variables > Actions > Variables > POSTER_SAATLERI
# (ornek deger: 11:00,14:00,16:00).

on:
  schedule:
    # Yalnizca guvenlik agi: zincir bir sekilde kopmussa yeniden baslatir.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Bir halkanin surecegi dakika'
        required: false
        default: '300'

# Ayni anda tek is calisir. Zamanlanmis tetikleme uzun is surerken gelirse
# beklemede kalir ve is bitince zinciri devralir; ikinci bir zincir olusmaz.
concurrency:
  group: market-poster
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # is bitiminde kendini yeniden tetiklemek icin

jobs:
  post:
    runs-on: ubuntu-latest
    # 300 dakikalik halka + halka sonuna 15 dk kadar tasan son gonderim
    # (bkz. dongu(), src/index.js) + kurulum payi.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Fontlari kur (poster tipografisi icin)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-noto-core fonts-noto-color-emoji

      - name: Chromium'u kur
        run: npx playwright install --with-deps chromium

      - name: Poster'i gonderim saatlerinde yakala ve Slack'e gonder
        run: node src/index.js --loop
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Tum Slack workspace'leri ve kanallari tek JSON secret'ta.
          SLACK_CONFIG: ${{ secrets.SLACK_CONFIG }}
          # Tum Telegram botlari ve kanallari tek JSON secret'ta.
          # Yeni kanal eklemek icin yalnizca bu secret guncellenir.
          TELEGRAM_CONFIG: ${{ secrets.TELEGRAM_CONFIG }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          POSTER_SAATLERI: ${{ vars.POSTER_SAATLERI || '11:00,14:00,16:00,16:50,17:00,18:00' }}
          # Sayfa acildiktan sonra grafikler icin en fazla kac saniye beklensin.
          GRAFIK_BEKLEME_SN: ${{ vars.POSTER_GRAFIK_BEKLEME_SN || '50' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '300' }}

      - name: Hata durumunda ciktiyi sakla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: poster-debug
          path: out/
          if-no-files-found: ignore
          retention-days: 3

      # Is basarisiz bitse bile zincir devam etmeli; aksi halde tek bir gecici
      # hata akisi kalici olarak durdururdu.
      - name: Zinciri devam ettir
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Market Poster -> Slack" --ref "${{ github.ref_name }}"
